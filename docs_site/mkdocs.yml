site_name: TCGA-BRCA Pipeline
site_description: End-to-end genomic data pipeline — GDC extraction, DuckDB, dbt, survival analysis
site_url: https://stavgrossfeld.github.io/tcga-dbt
repo_url: https://github.com/stavgrossfeld/tcga-dbt
repo_name: stavgrossfeld/tcga-dbt

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Pipeline:
    - Overview: pipeline/overview.md
    - Extraction: pipeline/extraction.md
    - Transform: pipeline/transform.md
  - Analysis:
    - Survival: analysis/survival.md
    - Mutations: analysis/mutations.md
  - Data Dictionary: data-dictionary.md
  - dbt Docs: dbt-docs.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
